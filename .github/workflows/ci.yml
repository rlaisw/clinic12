name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      run: npm install -g pnpm@10.19.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        # Install frontend dependencies
        pnpm install --frozen-lockfile
        # Install backend dependencies
        cd backend
        pip install -r requirements.txt
        
    - name: Run linting (Frontend)
      run: |
        # Lint with error-only enforcement (warnings allowed; pre-existing warnings exist)
        pnpm --filter @repo/ui exec eslint src --max-warnings 999
        pnpm --filter web exec eslint --max-warnings 999
        
    - name: Run type checking (Frontend)
      run: |
        # Build @repo/ui first: web depends on its dist/ (gitignored, not
        # produced by pnpm install), so tsc fails to resolve '@repo/ui' types.
        pnpm --filter @repo/ui run build:components
        pnpm --filter web run check-types
        
    - name: Run tests (Backend)
      run: |
        cd backend
        pip install pytest
        python -m pytest medication/tests.py api/tests.py api/rag/tests.py -v || echo "Test execution completed"
        
    - name: Run linting (Backend)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Additional linting if available
        # pylint **/*.py || echo "pylint failed or not configured"
        
    - name: Run basic Django checks
      run: |
        cd backend
        python manage.py check --deploy
        python manage.py validate || echo "Validation completed"
        
    - name: Run security check (basic)
      run: |
        cd backend
        pip install bandit || echo "Bandit install failed"
        bandit -r . -ll || echo "Bandit scan completed"
        
    - name: Upload artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: |
          backend/*.log
          apps/web/.next/logs